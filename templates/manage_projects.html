<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resident Management</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/css/main.css" />
    <script src="/static/js/theme.js" defer></script>
    {% if lobby_auth_enabled %}
    <script src="/static/js/lobby-indicator.js" defer></script>
    {% endif %}
    <script src="/static/js/manage-projects.js" defer></script>
  </head>
  <body>
    <main class="page">
      {% include "partials/top_nav.html" with context %}
      <header class="page-header">
        <div>
          <h1>Resident Management</h1>
          <p class="hint">Add new residents and archive completed work.</p>
        </div>
      </header>

      <section class="card card-compact manage-card">
        <h2>Add resident</h2>
        <form id="add-project-form" class="manage-form">
          <div class="manage-form-row manage-form-row-create">
            <div>
              <label class="field-label" for="project-name">Resident name</label>
              <input
                id="project-name"
                class="field-input"
                type="text"
                placeholder="e.g. Jordan Lee"
                required
              />
            </div>
            <div>
              <label class="field-label" for="project-house">House</label>
              <select id="project-house" class="field-input" required>
                <option value="Unassigned">Unassigned</option>
                <option value="Actioners">Actioners</option>
                <option value="SF2">SF2</option>
              </select>
            </div>
            <button type="submit" class="action-button">Add resident</button>
          </div>
        </form>
      </section>

      <section class="card manage-card">
        <div class="manage-table-header">
          <div>
            <h2>Residents</h2>
            <span class="hint"
              >Archived residents are hidden from the main selector.</span
            >
          </div>
          <div class="manage-filter-group">
            <label class="field-label" for="manage-house-filter">House filter</label>
            <select id="manage-house-filter" class="field-input">
              <option value="All houses">All houses</option>
              <option value="Unassigned">Unassigned</option>
              <option value="Actioners">Actioners</option>
              <option value="SF2">SF2</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="project-table">
            <thead>
              <tr>
                <th class="column-id">
                  <button type="button" class="table-sort" data-sort="id">
                    <span class="table-sort-label">ID</span>
                    <span class="table-sort-indicator" aria-hidden="true"></span>
                  </button>
                </th>
                <th>
                  <button type="button" class="table-sort" data-sort="name">
                    <span class="table-sort-label">Resident</span>
                    <span class="table-sort-indicator" aria-hidden="true"></span>
                  </button>
                </th>
                <th class="column-house">House</th>
                <th>
                  <button type="button" class="table-sort" data-sort="archived">
                    <span class="table-sort-label">Archived</span>
                    <span class="table-sort-indicator" aria-hidden="true"></span>
                  </button>
                </th>
              </tr>
            </thead>
            <tbody id="project-table-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button
            type="button"
            class="action-button pagination-button"
            id="pagination-prev"
          >
            Previous
          </button>
          <span class="pagination-status" id="pagination-status" aria-live="polite">
            Page 1 of 1
          </span>
          <button
            type="button"
            class="action-button pagination-button"
            id="pagination-next"
          >
            Next
          </button>
        </div>
      </section>
    </main>
    <button type="button" class="theme-toggle" id="theme-toggle">
      System
    </button>
  </body>
</html>
