<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Reset · North Star Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/css/main.css" />
    <script src="/static/js/theme.js" defer></script>
    <script src="/static/js/lobby-indicator.js" defer></script>
    <script src="/static/js/session_reset.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>Session Reset</h1>
          <p class="hint">Restore your session cookie if it was cleared.</p>
        </div>
        {% include "partials/navbar.html" with context %}
      </header>
      <section class="card card-compact">
        <p class="helper-text" id="reset-message">
          We lost your session cookie. We’ll attempt to restore it using your local keypair.
        </p>
        <div class="link-button-group">
          <button class="link-button" type="button" id="reset-retry">
            Retry now
          </button>
          <a class="link-button" href="/lobby">Go to lobby</a>
        </div>
      </section>
    </main>
  </body>
</html>
