<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/css/main.css" />
    <script src="/static/js/theme.js" defer></script>
    <script src="/static/js/lobby-indicator.js" defer></script>
    <script src="/static/js/ledger.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>Ledger</h1>
          <p class="hint">Approval history and admin activity.</p>
        </div>
        <div class="link-button-group">
          <a class="link-button" href="/">Dashboard</a>
          <a class="link-button" href="/lobby"
            >Lobby <span class="badge" data-lobby-count hidden></span
          ></a>
          <a class="link-button" href="/projects">Manage residents</a>
          <a class="link-button" href="/settings">Settings</a>
        </div>
      </header>

      <section class="card">
        <div class="table-wrapper">
          <table class="project-table ledger-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Action</th>
                <th>Approver</th>
                <th>Subject</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="ledger-table-body"></tbody>
          </table>
        </div>
        <p class="hint" id="ledger-empty" hidden>No ledger entries yet.</p>
      </section>
    </main>
    <button type="button" class="theme-toggle" id="theme-toggle">
      System
    </button>
  </body>
</html>
